{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Antonia's</title>
  <link rel="stylesheet" href="{% static 'css/output.css' %}" />
</head>
<body class="overflow-x-hidden">

<div class="flex min-h-screen items-center justify-center bg-background px-4 py-8 sm:py-12">

  <div class="w-full max-w-md rounded-card border border-border bg-background-secondary p-5 shadow-lg shadow-accent sm:p-7">

    <a href="/" class="text-sm font-bold text-secondary transition hover:underline hover:opacity-80 underline-offset-2">
      ← Home Page
    </a>

    <h1 class="my-6 text-center text-3xl font-bold sm:my-10 sm:text-5xl">Login</h1>

    <form method="post" class="flex flex-col gap-4 sm:gap-5">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}" />

      {% if form.errors %}
        <p class="rounded-button bg-error p-3 text-center text-sm font-bold text-soft-white opacity-90">
          Incorrect username or password. Please try again.
        </p>
      {% endif %}

      <input
        type="text"
        name="username"
        placeholder="Username"
        autocomplete="username"
        class="w-full rounded-button border border-border bg-soft-white p-3 text-base outline-0 transition focus-within:border-primary sm:p-4"
      />

      <input
        type="password"
        name="password"
        placeholder="Password"
        autocomplete="current-password"
        class="w-full rounded-button border border-border bg-soft-white p-3 text-base outline-0 transition focus-within:border-primary sm:p-4"
      />

      <a
        href="{% url 'accounts:password_reset' %}"
        class="flex self-end text-sm hover:text-secondary"
      >Forgot Password?</a>

      <button
        type="submit"
        class="w-full rounded-xl bg-secondary p-3 text-base text-soft-white transition hover:bg-primary sm:p-4 sm:text-lg"
      >
        Submit
      </button>
    </form>

    <hr class="my-6 border-border sm:my-8" />

    <p class="mb-4 text-center text-sm sm:text-base">or begin with:</p>

    <div class="mb-6 flex justify-center gap-4">
      <a
        href="#"
        aria-label="Sign in with Google"
        class="flex size-12 cursor-pointer items-center justify-center rounded-full border border-border bg-soft-white"
      >
        <img src="{% static 'images/google.png' %}" alt="" class="size-6 object-contain" />
      </a>
    </div>

    <p class="text-center text-sm sm:text-base">
      Don't have an account?
      <a
        href="{% url 'accounts:register' %}"
        class="font-bold text-secondary underline underline-offset-2 transition hover:opacity-80"
      >register here.</a>
    </p>

  </div>
</div>
</body>
</html>
