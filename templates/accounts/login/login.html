{% load static %}
<link rel="stylesheet" href="{% static 'css/output.css' %}" />
<div
  class="min-h-screen bg-background flex items-center justify-center"
>
  <div
    class="w-full max-w-md bg-background-secondary rounded-card shadow-lg shadow-accent p-7 border border-border"
  >
    <a href="/" class="text-secondary text-sm font-bold hover:underline hover:opacity-80 underline-offset-2 transition">← Home Page</a>

    <h1 class="text-5xl font-bold text-center my-10">Login</h1>

    <form method="post" class="flex flex-col gap-5">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}" />

      {% if form.errors %}
        <p class="p-3 bg-error text-center font-bold text-sm text-soft-white rounded-button opacity-90">
          Incorrect username or password. Please try again.
        </p>
      {% endif %}

      <input
        type="text"
        name="username"
        placeholder="Username"
        autocomplete="username"
        class="w-full p-4 rounded-button border border-border bg-background outline-0 transition focus-within:border-primary"
      />

      <input
        type="password"
        name="password"
        placeholder="Password"
        autocomplete="current-password"
        class="w-full p-4 rounded-button border border-border bg-background outline-0 transition focus-within:border-primary"
      />

      <a
        href="{% url 'accounts:password_reset' %}"
        class="flex self-end text-sm hover:text-secondary"
        >Forgot Password?</a
      >

      <button
        type="submit"
        class="w-full p-4 rounded-xl bg-secondary transition hover:bg-primary text-soft-white text-xl"
      >
        Submit
      </button>
    </form>

    <hr class="my-8 border-border" />

    <p class="text-center mb-4">or begin with:</p>

    <div class="flex justify-center gap-4 mb-6">
      <button
        href="#"
        class="w-12 h-12 rounded-full bg-white flex items-center justify-center border border-border cursor-pointer"
      >
        <img
          src="{% static 'images/google.png' %}"
          alt="Google"
          class="w-6 h-6 object-contain"
        />
      </button>

      <button
        href="#"
        class="w-12 h-12 rounded-full bg-white flex items-center justify-center border border-border cursor-pointer"
      >
        <img
          src="{% static 'images/facebook.png' %}"
          alt="Facebook"
          class="w-6 h-6 object-contain"
        />
      </button>
    </div>

    <p class="text-center">
      Don't have an account?
      <a href="{% url 'accounts:register' %}" class="font-bold text-secondary underline hover:underline hover:opacity-80 underline-offset-2 transition"
        >register here.</a
      >
    </p>
  </div>
</div>
