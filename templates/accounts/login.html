{% extends "base.html" %} {% load static %} {% block content %}
<script src="https://cdn.tailwindcss.com"></script>

<div class="min-h-screen bg-stone-100 flex flex-col items-center py-16">
  <p class="text-stone-500 mb-16">
    Home / <span class="text-black">Login</span>
  </p>

  <div class="w-full max-w-md bg-stone-200 rounded-3xl shadow-xl p-10">
    <a href="/" class="text-red-900 text-sm font-semibold">← Home Page</a>

    <h1 class="text-5xl font-serif font-bold text-center my-10">Login</h1>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}" />

      {% if form.errors %}
      <p class="text-center text-sm text-red-800">
        Incorrect username or password. Please try again.
      </p>
      {% endif %}

      <input
        type="text"
        name="username"
        placeholder="Username"
        autocomplete="username"
        class="w-full p-4 rounded-xl border bg-stone-50"
      />

      <input
        type="password"
        name="password"
        placeholder="Password"
        autocomplete="current-password"
        class="w-full p-4 rounded-xl border bg-stone-50"
      />

      <a
        href="#"
        class="block text-right text-sm hover:text-[#7A4035] text-stone-500"
        >Forgot Password?</a
      >

      <button
        type="submit"
        class="w-full p-4 rounded-xl bg-[#7A4035] hover:bg-red-900 text-white text-xl"
      >
        Submit
      </button>
    </form>

    <hr class="my-8 border-stone-400" />

    <p class="text-center text-stone-500 mb-4">or begin with:</p>

    <div class="flex justify-center gap-4 mb-6">
      <a
        href="#"
        class="w-12 h-12 rounded-full bg-white flex items-center justify-center border border-gray-300"
      >
        <img
          src="{% static 'images/google.png' %}"
          alt="Google"
          class="w-6 h-6 object-contain"
        />
      </a>

      <a
        href="#"
        class="w-12 h-12 rounded-full bg-white flex items-center justify-center border border-gray-300"
      >
        <img
          src="{% static 'images/facebook.png' %}"
          alt="Facebook"
          class="w-6 h-6 object-contain"
        />
      </a>
    </div>

    <p class="text-center text-stone-500">
      Don't have an account?
      <a href="{% url 'accounts:register' %}" class="text-red-800 underline">register here.</a>
    </p>
  </div>
</div>
{% endblock %}
