{% load static %}
<link rel="stylesheet" href="{% static 'css/output.css' %}" />

<div class="min-h-screen bg-background flex items-center justify-center">
  <div class="w-full max-w-md bg-background-secondary rounded-card shadow-lg shadow-accent p-7">
    <a href="{% url 'accounts:login' %}" class="text-secondary text-sm font-bold hover:underline hover:opacity-80 underline-offset-2 transition">← Back to Login</a>

    <h1 class="text-4xl font-bold text-center my-10">Forgot Password</h1>
    <p class="text-center mb-6">
      Enter your email and we'll send you a link to reset your password.
    </p>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <input
        type="email"
        name="email"
        placeholder="Email"
        autocomplete="email"
        value="{{ form.email.value|default:'' }}"
        class="w-full p-4 rounded-button border border-border bg-soft-white outline-0 transition focus-within:border-primary"
      />
      {% for error in form.email.errors %}
        <p class="text-sm text-error">{{ error }}</p>
      {% endfor %}

      <button type="submit" class="w-full h-14 rounded-button bg-secondary transition text-soft-white text-lg hover:bg-primary">
        Send reset link
      </button>
    </form>
  </div>
</div>
