{% extends "base.html" %}
{% block title %}Check Your Email | Antonia's{% endblock %}
{% block content %}
<script src="https://cdn.tailwindcss.com"></script>

<div class="min-h-screen bg-stone-100 flex flex-col items-center py-16">
  <div class="w-full max-w-md bg-stone-200 rounded-3xl shadow-xl p-10 text-center">
    <h1 class="text-4xl font-serif font-bold my-6">Check your email</h1>
    <p class="text-stone-500 mb-8">
      If an account exists for that email, we've sent a link to reset your password.
    </p>
    <a href="{% url 'accounts:login' %}" class="text-red-800 underline">Back to Login</a>
  </div>
</div>
{% endblock %}
