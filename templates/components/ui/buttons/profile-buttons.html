{% load static %}
{# BUTTON TABS #}
<section class="px-16 py-2">
  <div role="tablist" class="flex gap-3">
    {% for tab in profile_tabs %}
        <button type="button" role="tab" data-tab="{{ tab.page }}"
            aria-selected="{% if forloop.first %}true{% else %}false{% endif %}"
            class="rounded-full border border-border px-6 py-3 text-sm aria-selected:bg-secondary aria-selected:text-white"> {{ tab.label }}
        </button>
    {% endfor %}
</section>

{# PAGES #}
{% for tab in profile_tabs %}
  <section id="{{ tab.page }}" data-panel {% if not forloop.first %}hidden{% endif %}>
    {% include tab.template %}
  </section>
{% endfor %}

<script src="{% static 'js/profile_tabs.js' %}" defer></script>
