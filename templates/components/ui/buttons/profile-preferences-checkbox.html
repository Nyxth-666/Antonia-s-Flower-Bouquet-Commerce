{% load static %}
<div class="border-b border-border">
    <label class="relative flex cursor-pointer items-center justify-between py-3 text-sm has-focus-visible:ring-2">
        {{ title }}
        <input type="checkbox" name="notify" id="{{ id }}" value="email" class="peer sr-only">
        <span class="flex size-6 shrink-0 items-center justify-center rounded-md border-2 border-secondary peer-checked:bg-secondary peer-checked:[&>img]:visible">
            <img src="{% static 'icons/radio-checked.svg' %}" alt="" class="invisible">
        </span>
    </label>
</div>
