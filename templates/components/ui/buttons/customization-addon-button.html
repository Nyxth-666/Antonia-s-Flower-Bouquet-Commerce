<button type="button" data-addon="{{ label }}" data-price="{{ price|cut:'₱' }}" aria-pressed="false"
  class="flex min-w-0 cursor-pointer items-center justify-between gap-2 rounded-xl border border-border px-3 py-2 text-sm text-muted transition-colors duration-200 hover:border-accent hover:text-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
  <span class="truncate">{{ label }}</span>
  <span class="shrink-0">{{ price }}</span>
</button>
