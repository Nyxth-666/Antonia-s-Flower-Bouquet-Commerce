<div class="space-y-3">
    {% for occasion in occasions %}
        <label class="flex cursor-pointer items-center gap-3 text-sm transition hover:text-primary">
            <input
                type="checkbox"
                name="occasion"
                value="{{ occasion.id }}"
                class="size-4 accent-primary"
                {% if occasion.id|stringformat:"s" in selected_occasions %}checked{% endif %}
            >
            <span>{{ occasion.name }}</span>
        </label>
    {% empty %}
        <p class="text-sm">
            No occasions available.
        </p>
    {% endfor %}
</div>
