<form id="contact-form" method="post" action=""
    class="grid content-start gap-5 rounded-card bg-background-secondary px-4 py-6 shadow-[inset_0_0_0_1px_#d9b8ae,inset_0_0_18px_rgba(124,64,56,0.28)] md:gap-7 md:px-5 md:py-8 lg:px-[62px] lg:py-[68px]">
    {% csrf_token %}

    <h2 class="font-heading text-xl font-bold lg:hidden">Send a message</h2>

    <div class="grid gap-5 sm:grid-cols-2 sm:gap-[21px] md:gap-7">
        <div class="grid gap-1.5">
            <label for="cf-first" class="text-xs lg:hidden">First name</label>
            <input id="cf-first" type="text" name="first_name" placeholder="First name" aria-label="First name" autocomplete="given-name" required
                class="h-12 w-full rounded-[10px] border border-border bg-card px-4 text-base placeholder:text-muted transition focus:border-primary outline-none md:h-[60px] md:px-6 md:text-[21px]">
        </div>
        <div class="grid gap-1.5">
            <label for="cf-last" class="text-xs lg:hidden">Last name</label>
            <input id="cf-last" type="text" name="last_name" placeholder="Last name" aria-label="Last name" autocomplete="family-name" required
                class="h-12 w-full rounded-[10px] border border-border bg-card px-4 text-base placeholder:text-muted transition focus:border-primary outline-none md:h-[60px] md:px-6 md:text-[21px]">
        </div>
    </div>

    <div class="grid gap-1.5">
        <label for="cf-email" class="text-xs lg:hidden">Email</label>
        <input id="cf-email" type="email" name="email" placeholder="Email" aria-label="Email" autocomplete="email" required
            class="h-12 w-full rounded-[10px] border border-border bg-card px-4 text-base placeholder:text-muted transition focus:border-primary outline-none md:h-[60px] md:px-6 md:text-[21px]">
    </div>

    <div class="grid gap-1.5">
        <label for="cf-phone" class="text-xs lg:hidden">Phone Number (optional)</label>
        <input id="cf-phone" type="tel" name="phone" placeholder="Phone Number (optional)" aria-label="Phone number (optional)" autocomplete="tel"
            class="h-12 w-full rounded-[10px] border border-border bg-card px-4 text-base placeholder:text-muted transition focus:border-primary outline-none md:h-[60px] md:px-6 md:text-[21px]">
    </div>

    <div class="grid gap-1.5">
        <label for="cf-message" class="text-xs lg:hidden">Your Message</label>
        <textarea id="cf-message" name="message" placeholder="Your Message" aria-label="Your message" required
            class="h-[160px] w-full resize-none rounded-[10px] border border-border bg-card px-4 pt-4 text-base placeholder:text-muted transition focus:border-primary outline-none md:h-[230px] md:px-6 md:pt-5 md:text-[21px]"></textarea>
    </div>

    <p class="-mt-[10px] -mb-[2px] text-[10px] leading-[15px]">
        This website is protected by reCAPTCHA, and the Google
        <a href="#" class="text-accent hover:underline">Privacy Policy</a> and
        <a href="#" class="text-accent hover:underline">Terms of Service</a> apply.
    </p>

    <label class="flex items-center gap-[15px] text-[15px]">
        <input type="checkbox" name="accept_terms" required
            class="relative h-[22px] w-[22px] shrink-0 appearance-none rounded-[4px] border border-border bg-card checked:border-secondary checked:bg-secondary checked:after:absolute checked:after:inset-0 checked:after:text-center checked:after:text-[14px] checked:after:leading-[20px] checked:after:text-white checked:after:content-['✓'] transition focus:border-primary outline-none">
        <span>I accept the <a href="#" class="text-accent hover:underline">terms of agreement</a>.</span>
    </label>

    <button type="submit"
        class="h-12 rounded-[10px] bg-secondary text-xl font-medium text-[#f6efe8] transition-colors hover:bg-primary disabled:opacity-70 md:h-[61px] md:text-[25px]">
        Submit
    </button>
</form>
