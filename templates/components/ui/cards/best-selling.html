{% load static %}

<section id="best-sellers" class="mt-24 pb-20">

    <div class="mx-auto w-full max-w-[1240px] px-4 sm:px-6">

        <!-- SECTION HEADER -->
        <div class="mb-7 flex items-end justify-between gap-5">

            <div>
                <h2 class="text-4xl font-bold md:text-5xl">
                    Best Sellers
                </h2>

                <p class="mt-2 max-w-[520px] text-sm text-muted">
                    Each flower comes with its meaning, so the bouquet says what you mean.
                </p>
            </div>

            <a href="#best-sellers"
                class="hidden text-sm font-semibold underline-offset-2 hover:underline sm:block">
                Browse the full catalogue →
            </a>

        </div>


        <div class="grid grid-cols-4 grid-rows-2 gap-4 ">
        {% for bouquet in best_sellers %}
            {% include "components/ui/cards/catalog-products-card.html" with bouquet=bouquet %}
        {% endfor %}

    </div>

</section>
