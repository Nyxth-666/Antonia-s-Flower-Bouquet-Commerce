<a href="{% url 'catalog:catalog' %}"
   class="group relative flex h-[255px] w-full max-w-[275.75px] flex-col justify-end overflow-hidden rounded-card border border-border bg-card transition-all duration-300 hover:shadow-lg hover:shadow-accent/30">

       {% if arrangement_type.image %}
        <img
            src="{{ arrangement_type.image.url }}"
            alt="{{ arrangement_type.name }}"
            aria-hidden="true"
            class="absolute inset-0 h-full w-full object-cover opacity-60 transition-transform duration-500 ease-out group-hover:scale-110 group-hover:opacity-80"
        >
    {% endif %}

    <div class="absolute inset-0 bg-gradient-to-t from-background via-background/70 to-transparent"></div>

        <div class="relative z-10 p-5">
            <h3 class="text-base font-bold leading-snug transition-colors duration-300 group-hover:text-primary">
                {{ arrangement_type.name }}
            </h3>

            <p class="mt-1 text-xs leading-relaxed">
                {{ arrangement_type.description }}
            </p>
        </div>
</a>
