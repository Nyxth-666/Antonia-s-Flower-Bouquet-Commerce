<div
  class="grid w-[900px] max-w-[calc(100vw-2rem)] grid-cols-2 gap-8 rounded-b-card border border-secondary bg-background p-8 shadow-[0_10px_35px_rgba(165,89,75,0.4)]"
>
  <div class="flex flex-col">
    <a
      href="{% url 'catalog:flowers-catalog' %}"
      class="mb-5 border-b border-border pb-3 text-2xl font-bold text-muted transition hover:text-primary font-serif"
    >
      Flower Type
    </a>

    <div class="grid grid-cols-2 gap-4">
        {% for flower in flower_types %}
            <a
            href="{% url 'catalog:catalog' %}"
            class="mb-2 block text-sm text-muted transition hover:text-primary"
            >
            {{ flower.name }}
            </a>
            {% empty %}
            <p class="text-sm">No flower types available.</p>
        {% endfor %}
    </div>
  </div>

  <div class="flex flex-col">
    <a
      href="{% url 'catalog:arrangements-catalog' %}"
      class="mb-5 border-b border-border pb-3 text-2xl font-bold text-muted transition hover:text-primary font-serif"
    >
      Arrangement Type
    </a>

    <div class="grid grid-cols-2 gap-4">
        {% for arrangement in arrangement_types %}
        <a
        href="{% url 'catalog:catalog' %}"
        class="mb-2 block text-sm text-muted transition hover:text-primary"
        >
        {{ arrangement.name }}
        </a>
        {% empty %}
        <p class="text-sm">No arrangements available.</p>
        {% endfor %}
    </div>
  </div>
</div>
