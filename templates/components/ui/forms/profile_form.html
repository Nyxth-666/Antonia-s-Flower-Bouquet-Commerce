<label class="flex flex-col gap-2 text-xs font-bold">
    {{ label }}
    <input type="{{ type|default:'text' }}" name="{{ name }}" value="{{ value|default:'' }}" placeholder="{{ placeholder }}" class="h-12 rounded-lg border border-border bg-[#FAF9F5] px-4 text-sm font-normal placeholder:text-foreground {{ class }}">
    {% if error %}
        <span class="text-xs font-normal text-red-800">{{ error }}</span>
    {% endif %}
</label>
