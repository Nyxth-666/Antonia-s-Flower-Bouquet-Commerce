
{% load static %}

<!-- SVG ICON DEFINITIONS -->
<svg xmlns="http://www.w3.org/2000/svg"
     class="absolute h-0 w-0 overflow-hidden"
     aria-hidden="true">

    <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"/>
        <path d="m20 20-3.5-3.5"/>
    </symbol>

    <symbol id="i-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/>
    </symbol>

    <symbol id="i-heart" viewBox="0 0 24 24">
        <path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>
    </symbol>

    <symbol id="i-cart" viewBox="0 0 24 24">
        <path d="M3 4h2l2.5 11h10L20 7H6"/>
        <circle cx="9" cy="19" r="1"/>
        <circle cx="17" cy="19" r="1"/>
    </symbol>

    <symbol id="i-chevron" viewBox="0 0 24 24">
        <path d="m6 9 6 6 6-6"/>
    </symbol>
</svg>

<!-- HEADER: LOGO, SEARCH, ACCOUNT, WISHLIST, CART -->
<header class="bg-cream">
    <div class="mx-auto flex w-full max-w-[1240px] flex-wrap
                items-center gap-x-6 gap-y-3 px-4 py-3
                sm:px-6 md:gap-x-10">

        <a href="/" class="inline-flex items-center gap-2.5"
           aria-label="Antonia's home">

            <img src="{% static 'images/logo.png' %}"
                 alt="Antonia's logo"
                 class="h-10 w-10 rounded-full object-cover">

            <span class="font-serif text-2xl font-semibold
                         italic text-terra">
                Antonia’s
            </span>
        </a>

        <!-- SEARCH BAR -->
        <form role="search" action="#" method="get"
              class="order-last flex w-full items-center gap-2
                     rounded-lg border border-line bg-paper
                     px-3 py-2 text-ink-soft
                     sm:order-none sm:w-auto sm:flex-1">

            <svg class="h-4 w-4 flex-none fill-none
                        stroke-current"
                 stroke-width="1.6"
                 stroke-linecap="round">
                <use href="#i-search"/>
            </svg>

            <input type="search" name="q"
                   placeholder="Search flowers"
                   aria-label="Search flowers"
                   class="w-full min-w-0 bg-transparent
                          text-sm text-ink outline-none
                          placeholder:text-ink-soft">
        </form>

        <!-- HEADER ACTIONS -->
        <div class="ml-auto flex items-center gap-4 sm:ml-0">

            <a href="#" aria-label="Account"
               class="transition hover:text-terra">
                <svg class="h-5 w-5 fill-none stroke-current"
                     stroke-width="1.6"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                    <use href="#i-user"/>
                </svg>
            </a>

            <a href="#" aria-label="Wishlist"
               class="transition hover:text-terra">
                <svg class="h-5 w-5 fill-none stroke-current"
                     stroke-width="1.6"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                    <use href="#i-heart"/>
                </svg>
            </a>

            <a href="#" aria-label="Shopping cart"
               class="transition hover:text-terra">
                <svg class="h-5 w-5 fill-none stroke-current"
                     stroke-width="1.6"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                    <use href="#i-cart"/>
                </svg>
            </a>

        </div>
    </div>

    <!-- NAVIGATION BAR -->
    <nav aria-label="Main navigation"
         class="bg-[#7A4035] text-white
                shadow-[0_8px_18px_rgba(123,59,50,0.25)]">

        <ul class="mx-auto flex max-w-[1240px] flex-wrap
                   justify-center gap-x-6 gap-y-1
                   px-4 py-2 text-xs sm:text-sm md:gap-x-8">

            <li>
                <a href="/"
                   class="inline-flex items-center border-b
                          border-transparent py-1 hover:border-white">
                    Home
                </a>
            </li>

            <li>
                <a href="#occasions"
                   class="inline-flex items-center gap-1
                          border-b border-transparent py-1
                          hover:border-white">
                    Occasions
                    <svg class="h-3 w-3 fill-none stroke-current"
                         stroke-width="1.6">
                        <use href="#i-chevron"/>
                    </svg>
                </a>
            </li>

            <li>
                <a href="#"
                   class="inline-flex items-center gap-1
                          border-b border-transparent py-1
                          hover:border-white">
                    By Types
                    <svg class="h-3 w-3 fill-none stroke-current"
                         stroke-width="1.6">
                        <use href="#i-chevron"/>
                    </svg>
                </a>
            </li>

            <li>
                <a href="#"
                   class="inline-flex items-center border-b
                          border-transparent py-1 hover:border-white">
                    Customize
                </a>
            </li>

            <li>
                <a href="#"
                   class="inline-flex items-center border-b
                          border-transparent py-1 hover:border-white">
                    About
                </a>
            </li>

            <li>
                <a href="#"
                   class="inline-flex items-center border-b
                          border-transparent py-1 hover:border-white">
                    Contact Us
                </a>
            </li>

        </ul>
    </nav>
</header>
