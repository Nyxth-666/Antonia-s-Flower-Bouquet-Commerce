{# params: label, name, options (iterable from the view) #}
<div class="relative">
    <select name="{{ name }}" aria-label="{{ label }}"
            class="h-12 w-full appearance-none rounded-button border border-border bg-[#E8E3D5] px-4 pr-10 text-muted">
        <option value="">{{ label }}</option>
        {% for option in options %}<option value="{{ option }}">{{ option }}</option>{% endfor %}
    </select>
    <svg viewBox="0 0 10 6" class="pointer-events-none absolute right-4 top-1/2 w-2.5 -translate-y-1/2 text-muted" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg>
</div>
